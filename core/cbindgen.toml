language = "C"
include_guard = "NOTETAKER_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"
include_version = true
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false

[export]
include = []

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"
