name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core Library (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            targets: macos ios
          - platform: windows
            runner: windows-latest
            targets: windows
          - platform: linux
            runner: ubuntu-latest
            targets: linux android
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev

      - name: Setup Android NDK
        if: matrix.platform == 'linux'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        if: matrix.platform == 'linux'
        run: cargo install cargo-ndk

      - name: Build core library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-core.sh
          scripts/build-core.sh ${{ matrix.targets }}

      # build.rs regenerates core/include/notetaker.h via cbindgen on every build.
      # If the committed header has drifted from the current FFI surface, fail —
      # the native apps (Swift/C#) decode against this header.
      - name: Check FFI header is up to date
        if: matrix.platform == 'linux'
        run: git diff --exit-code core/include/notetaker.h

      # cloud enables reqwest/rustls. Scope it to this native test build only:
      # forcing it onto build-core.sh would also hit the Android cross-compile
      # (ring) in this same job and could break the Linux core artifact.
      - name: Run core tests
        if: matrix.platform == 'linux'
        run: cargo test -p notetaker-core --features cloud

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: dist/core/
          retention-days: 7

  app-macos:
    name: macOS App
    needs: core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-macos
          path: dist/core/

      - name: Build macOS app
        run: |
          if [ -d "apple" ]; then
            cd apple
            xcodebuild build \
              -scheme macOS \
              -configuration Release \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/dist/core/macos" || echo "::warning::macOS app build failed — app project may not exist yet"
          else
            echo "::warning::apple/ directory not found — skipping macOS app build"
          fi

      - name: Upload macOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: apple/build/Release/*.app
          if-no-files-found: warn
          retention-days: 7

  app-ios:
    name: iOS App
    needs: core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-macos
          path: dist/core/

      - name: Build iOS app
        run: |
          if [ -d "apple" ]; then
            cd apple
            xcodebuild build \
              -scheme iOS \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/dist/core/ios" || echo "::warning::iOS app build failed — app project may not exist yet"
          else
            echo "::warning::apple/ directory not found — skipping iOS app build"
          fi

      - name: Upload iOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: apple/build/Release-iphoneos/*.app
          if-no-files-found: warn
          retention-days: 7

  app-windows:
    name: Windows App
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-windows
          path: dist/core/

      - name: Build Windows app
        shell: bash
        run: |
          if [ -f "windows/NoteHelper/NoteHelper.sln" ]; then
            dotnet build windows/NoteHelper/NoteHelper.sln -c Release -p:Platform=x64 || echo "::warning::Windows app build failed (expected until DLL copy + Assets land in Phase 3)"
          else
            echo "::warning::windows/NoteHelper/NoteHelper.sln not found — skipping Windows app build"
          fi

      - name: Upload Windows app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: windows/NoteHelper/bin/x64/Release/net8.0-windows10.0.22621.0/**/*
          if-no-files-found: warn
          retention-days: 7

  app-linux:
    name: Linux App
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev cmake libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: app-linux

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-linux
          path: dist/core/

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-model-tiny

      - name: Download Whisper model
        run: bash scripts/download-model.sh tiny

      - name: Build Linux app
        run: cargo build --release -p notetaker-linux

      - name: Stage Linux distribution
        run: |
          mkdir -p app-linux-dist/models
          cp target/release/dbus-monitor-session app-linux-dist/
          cp models/ggml-tiny.bin app-linux-dist/models/
          cat > app-linux-dist/README-run.txt <<'EOF'
          chmod +x dbus-monitor-session && ./dbus-monitor-session  (ggml-tiny.bin is already in models/)
          EOF

      - name: Upload Linux app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: app-linux-dist/
          if-no-files-found: error
          retention-days: 7

  app-android:
    name: Android App
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-linux
          path: dist/core/

      - name: Copy JNI libraries
        run: |
          if [ -d "android/app/src/main/jniLibs" ] || [ -d "dist/core/android/jniLibs" ]; then
            mkdir -p android/app/src/main/jniLibs
            if [ -d "dist/core/android/jniLibs" ]; then
              cp -r dist/core/android/jniLibs/* android/app/src/main/jniLibs/
            fi
          fi

      - name: Build Android app
        run: |
          cd android && gradle wrapper --gradle-version 8.7 && ./gradlew assembleDebug || echo "::warning::Android build failed (expected until JNI bridge lands)"

      - name: Upload Android app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  test-transcription:
    name: Transcription Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-transcription

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libasound2-dev

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-model-tiny

      - name: Download Whisper model
        run: bash scripts/download-model.sh tiny

      - name: Download test fixture
        run: |
          mkdir -p samples
          curl -fL -o samples/jfk.wav https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav

      - name: Transcribe fixture
        shell: bash
        run: cargo run --release -p notetaker-core --bin transcribe-wav -- samples/jfk.wav models/ggml-tiny.bin | tee transcript-out.txt

      - name: Assert transcript content
        run: grep -i country transcript-out.txt

      # Exercise the FFI push-audio path (note_start_recording_push + note_push_audio)
      # with raw PCM, proving system-audio feed works end to end (P2-5 DoD).
      - name: Transcribe fixture via FFI push-audio
        shell: bash
        run: cargo run --release -p notetaker-core --bin transcribe-wav -- --via-ffi samples/jfk.wav models/ggml-tiny.bin | tee transcript-ffi-out.txt

      - name: Assert FFI transcript content
        run: grep -i country transcript-ffi-out.txt
