name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core Library (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            targets: macos ios
          - platform: windows
            runner: windows-latest
            targets: windows
          - platform: linux
            runner: ubuntu-latest
            targets: linux android
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.platform }}

      - name: Install cmake
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK
        if: matrix.platform == 'linux'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        if: matrix.platform == 'linux'
        run: cargo install cargo-ndk

      - name: Build core library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-core.sh
          scripts/build-core.sh ${{ matrix.targets }}

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: dist/core/
          retention-days: 7

  app-macos:
    name: macOS App
    needs: core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-macos
          path: dist/core/

      - name: Build macOS app
        run: |
          if [ -d "apple" ]; then
            cd apple
            xcodebuild build \
              -scheme macOS \
              -configuration Release \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO \
              LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/dist/core/macos" || echo "::warning::macOS app build failed — app project may not exist yet"
          else
            echo "::warning::apple/ directory not found — skipping macOS app build"
          fi

      - name: Upload macOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: apple/build/Release/*.app
          if-no-files-found: warn
          retention-days: 7

  app-ios:
    name: iOS App
    needs: core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-macos
          path: dist/core/

      - name: Build iOS app
        run: |
          if [ -d "apple" ]; then
            cd apple
            xcodebuild build \
              -scheme iOS \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/dist/core/ios" || echo "::warning::iOS app build failed — app project may not exist yet"
          else
            echo "::warning::apple/ directory not found — skipping iOS app build"
          fi

      - name: Upload iOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: apple/build/Release-iphoneos/*.app
          if-no-files-found: warn
          retention-days: 7

  app-windows:
    name: Windows App
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-windows
          path: dist/core/

      - name: Build Windows app
        shell: bash
        run: |
          if [ -f "windows/NoteHelper.sln" ]; then
            dotnet build windows/NoteHelper.sln -c Release -p:Platform=x64
          else
            echo "::warning::windows/NoteHelper.sln not found — skipping Windows app build"
          fi

      - name: Upload Windows app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: windows/bin/x64/Release/
          if-no-files-found: warn
          retention-days: 7

  app-linux:
    name: Linux App
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev cmake

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: app-linux

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-linux
          path: dist/core/

      - name: Build Linux app
        run: |
          if [ -d "linux" ]; then
            cargo build --release -p notetaker-linux
          else
            echo "::warning::linux/ directory not found — skipping Linux app build"
          fi

      - name: Upload Linux app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: target/release/notetaker-linux
          if-no-files-found: warn
          retention-days: 7

  app-android:
    name: Android App
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: core-linux
          path: dist/core/

      - name: Copy JNI libraries
        run: |
          if [ -d "android/app/src/main/jniLibs" ] || [ -d "dist/core/android/jniLibs" ]; then
            mkdir -p android/app/src/main/jniLibs
            if [ -d "dist/core/android/jniLibs" ]; then
              cp -r dist/core/android/jniLibs/* android/app/src/main/jniLibs/
            fi
          fi

      - name: Build Android app
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "::warning::android/gradlew not found — skipping Android app build"
          fi

      - name: Upload Android app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
